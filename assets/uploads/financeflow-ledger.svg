<svg width="1200" height="750" viewBox="0 0 1200 750" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ff-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#172554" />
    </linearGradient>
    <linearGradient id="ff-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
  </defs>
  <rect width="1200" height="750" fill="url(#ff-bg)"/>
  <!-- Header -->
  <rect x="0" y="0" width="1200" height="64" fill="#1e293b" opacity="0.9"/>
  <circle cx="36" cy="32" r="14" fill="url(#ff-accent)"/>
  <text x="64" y="38" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700">FinanceFlow Enterprise Ledger &amp; BI</text>
  <rect x="1000" y="18" width="160" height="30" rx="6" fill="#2563eb" opacity="0.25"/>
  <text x="1080" y="38" fill="#60a5fa" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Multi-Currency (USD/EUR/GBP)</text>

  <!-- Sidebar -->
  <rect x="0" y="64" width="220" height="686" fill="#0b1329"/>
  <rect x="16" y="86" width="188" height="36" rx="6" fill="#2563eb" opacity="0.2"/>
  <text x="54" y="109" fill="#93c5fd" font-family="sans-serif" font-size="14" font-weight="600">Executive Cashflow</text>
  <text x="54" y="153" fill="#94a3b8" font-family="sans-serif" font-size="14">General Ledger</text>
  <text x="54" y="197" fill="#94a3b8" font-family="sans-serif" font-size="14">Accounts Payable</text>
  <text x="54" y="241" fill="#94a3b8" font-family="sans-serif" font-size="14">Consolidated P&amp;L</text>

  <!-- Metrics -->
  <g transform="translate(244, 86)">
    <rect width="280" height="110" rx="10" fill="#1e293b" stroke="#334155"/>
    <text x="20" y="34" fill="#94a3b8" font-family="sans-serif" font-size="12" font-weight="600">NET CASH LIQUIDITY</text>
    <text x="20" y="76" fill="#38bdf8" font-family="sans-serif" font-size="32" font-weight="800">$4,892,140</text>
    <text x="20" y="96" fill="#34d399" font-family="sans-serif" font-size="11">▲ 18.2% vs previous quarter</text>
  </g>
  <g transform="translate(560, 86)">
    <rect width="280" height="110" rx="10" fill="#1e293b" stroke="#334155"/>
    <text x="20" y="34" fill="#94a3b8" font-family="sans-serif" font-size="12" font-weight="600">ACCOUNTS RECEIVABLE</text>
    <text x="20" y="76" fill="#f8fafc" font-family="sans-serif" font-size="32" font-weight="800">$612,450</text>
    <text x="20" y="96" fill="#94a3b8" font-family="sans-serif" font-size="11">94.8% current within 30 days</text>
  </g>
  <g transform="translate(876, 86)">
    <rect width="280" height="110" rx="10" fill="#1e293b" stroke="#334155"/>
    <text x="20" y="34" fill="#94a3b8" font-family="sans-serif" font-size="12" font-weight="600">MONTHLY BURN RATE</text>
    <text x="20" y="76" fill="#fbbf24" font-family="sans-serif" font-size="32" font-weight="800">$184,200</text>
    <text x="20" y="96" fill="#94a3b8" font-family="sans-serif" font-size="11">26.5 months runway remaining</text>
  </g>

  <!-- Big Chart Area -->
  <g transform="translate(244, 216)">
    <rect width="912" height="504" rx="12" fill="#1e293b" stroke="#334155"/>
    <text x="24" y="36" fill="#f1f5f9" font-family="sans-serif" font-size="16" font-weight="700">12-Month Rolling Cashflow Forecast &amp; Scenario Modeling</text>
    
    <!-- Chart Grid Lines -->
    <line x1="60" y1="100" x2="860" y2="100" stroke="#334155" stroke-dasharray="2"/>
    <line x1="60" y1="180" x2="860" y2="180" stroke="#334155" stroke-dasharray="2"/>
    <line x1="60" y1="260" x2="860" y2="260" stroke="#334155" stroke-dasharray="2"/>
    <line x1="60" y1="340" x2="860" y2="340" stroke="#334155" stroke-dasharray="2"/>
    <line x1="60" y1="420" x2="860" y2="420" stroke="#475569"/>

    <!-- Area Wave -->
    <path d="M60 380 Q160 320 260 350 T460 270 Q560 210 660 240 T860 140 L860 420 L60 420 Z" fill="url(#ff-accent)" fill-opacity="0.18"/>
    <path d="M60 380 Q160 320 260 350 T460 270 Q560 210 660 240 T860 140" stroke="#38bdf8" stroke-width="3.5" fill="none" stroke-linecap="round"/>

    <!-- Data Points -->
    <circle cx="260" cy="350" r="5" fill="#38bdf8"/>
    <circle cx="460" cy="270" r="5" fill="#38bdf8"/>
    <circle cx="660" cy="240" r="5" fill="#38bdf8"/>
    <circle cx="860" cy="140" r="6" fill="#60a5fa" stroke="#ffffff" stroke-width="2"/>
  </g>
